<style>

:root[data-theme="dark"]{ color-scheme:dark; --bg:#151515; --paper:#1F1F1F; --ink:#F2F2F2; --muted:#ABABAB; --line:#3A3A3A; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,sans-serif;font-size:17px;line-height:1.55;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

h1,h2,h3{font-family:"Unbounded","Onest",sans-serif;letter-spacing:-.01em;margin:0}
h2{font-weight:700;font-size:clamp(1.5rem,3.4vw,2.4rem);line-height:1.1;margin-bottom:12px}
p{margin:0 0 .8em;max-width:64ch}
.muted{color:var(--muted)}
section{padding:64px 0}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:6px}
.btn{font:inherit;font-weight:500;font-size:.95rem;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme{position:absolute;top:16px;right:16px}
.hero{padding:56px 0 8px;position:relative}
.hero h1{font-weight:900;font-size:clamp(1.55rem,8vw,5rem);line-height:.98;max-width:14ch}
.hero h1 .one{display:inline-block;background:var(--ink);color:var(--bg);padding:0 .18em;border-radius:.12em;transform:rotate(-2deg)}
.hero .lede{font-size:1.2rem;margin-top:22px;max-width:52ch}
.stamp{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-weight:500;font-size:.95rem;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;box-shadow:0 2px 0 var(--ink)}
.stamp i{width:10px;height:10px;border-radius:50%;background:var(--green)}
.flow{background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:18px;margin-top:28px}
.scen{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.flowgrid{display:grid;gap:18px}
@media(min-width:1000px){.flowgrid{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);align-items:start}}
.netwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg.net{width:100%;min-width:640px;height:auto;display:block}
.edge{stroke:var(--line);stroke-width:2;fill:none}
.edge.on{stroke:var(--ink);stroke-width:3.5;marker-end:url(#arr)}
.edge.now{stroke:var(--violet);stroke-width:5;marker-end:url(#arrv)}
@media (prefers-reduced-motion:no-preference){.edge.now{stroke-dasharray:10 8;animation:run .7s linear infinite}@keyframes run{to{stroke-dashoffset:-18}}}
.nd rect,.nd circle{stroke:var(--ink);stroke-width:2.5;transition:opacity .2s}
.nd text{font-size:19px;font-weight:600;fill:var(--ink)}
.nd.dim{opacity:.35}
.nd.lit rect,.nd.lit circle{stroke-width:4}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:.95rem;opacity:.35;transition:opacity .2s}
.steps li::before{content:counter(s);font-family:"Unbounded";font-weight:700;font-size:.85rem;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center}
.steps li.done,.steps li.now{opacity:1}
.steps li.now::before{background:var(--violet);color:#fff;border-color:var(--violet)}
.side h3{font-size:1.1rem;margin-bottom:6px}
.side .sub{font-size:.92rem;color:var(--muted);margin-bottom:14px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.rules{display:grid;gap:10px;margin-top:22px}
@media(min-width:760px){.rules{grid-template-columns:repeat(4,1fr)}}
.rule{border:2px solid var(--ink);border-radius:16px;padding:12px 14px;background:var(--paper);font-size:.9rem}
.rule b{font-family:"Unbounded";font-weight:700;font-size:.92rem;display:block;margin-bottom:4px}
.deck{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:640px){.deck{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.deck{grid-template-columns:repeat(3,1fr)}}
.card{perspective:1400px;height:440px}
.card button.flip{all:unset;display:block;width:100%;height:100%;cursor:pointer;border-radius:22px}
.card button.flip:focus-visible{outline:3px solid var(--violet);outline-offset:4px}
.inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.card.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2.5px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 6px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.back{transform:rotateY(180deg);padding:22px}
.top{background:var(--c);padding:18px 20px 16px;position:relative;border-bottom:2.5px solid var(--ink);color:#0E1A14}
.top .no{position:absolute;top:14px;right:16px;font-family:"Unbounded";font-weight:900;font-size:2.4rem;line-height:1;opacity:.35}

.body{padding:16px 20px 18px;display:flex;flex-direction:column;gap:10px;flex:1;font-size:.9rem;overflow:auto}
.body b{display:block;font-weight:700;font-size:.78rem;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links span{border:1.5px solid var(--ink);border-radius:999px;padding:1px 9px;font-size:.8rem}
.turn{margin-top:auto;font-size:.82rem;color:var(--muted)}
.back h3{font-size:1rem;margin:0 0 8px}
.back ul{margin:0 0 14px;padding-left:1.1em;font-size:.92rem}
.back li{margin-bottom:5px}

.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.92rem;margin:6px 0 18px}
.sw{display:inline-block;width:16px;height:16px;border-radius:4px;border:2px solid var(--ink);vertical-align:-3px;margin-right:6px}
.waffle{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.sq{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1/1;border:2.5px solid var(--ink);border-radius:14px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;font-size:.8rem;line-height:1.2;font-weight:500;color:#0E1A14;overflow:hidden}
.sq.A{background:var(--green)}
.sq.B{background:#fff;background-image:repeating-linear-gradient(135deg,rgba(33,160,56,.28) 0 6px,transparent 6px 12px)}
.sq.C{background:var(--ink);color:var(--bg)}

.sq .p{font-family:"Unbounded";font-weight:900;font-size:1.3rem}
.sq[aria-pressed="true"]{outline:3px solid var(--violet);outline-offset:3px}

.club{display:grid;gap:20px;margin-top:20px}

<script>
"use strict";
const D=JSON.parse(document.getElementById("data").textContent),U=D.ui;
const $=id=>document.getElementById(id);
function h(tag,props,kids){const e=document.createElement(tag);if(props)for(const k in props){if(k==="text")e.textContent=props[k];else if(k==="style")e.style.cssText=props[k];else e.setAttribute(k,props[k])}(kids||[]).forEach(c=>c&&e.appendChild(typeof c==="string"?document.createTextNode(c):c));return e}
const PALETTE=["var(--sun)","var(--rose)","var(--sky)","var(--violet)","var(--green)","var(--coral)","var(--lime)"];

/* theme: light by default, dark on request */
function setTheme(dark){document.documentElement.dataset.theme=dark?"dark":"light";$("theme").setAttribute("aria-pressed",dark);$("theme").textContent=dark?U.themeLight:U.themeDark}
$("theme").addEventListener("click",()=>setTheme(document.documentElement.dataset.theme!=="dark"));setTheme(false);

/* hero */
const t1=$("title");t1.textContent=D.title+" ";if(U.badge)t1.appendChild(h("span",{class:"one",text:U.badge}));
$("lede").textContent=U.lede;if(D.stamp)$("stamp").textContent=D.stamp;else $("stampWrap").remove();
$("scen").setAttribute("aria-label",U.scenariosLabel);$("net").setAttribute("aria-label",U.schemeLabel);
$("play").textContent=U.play;$("all").textContent=U.showAll;
U.rules.forEach(r=>$("rules").appendChild(h("div",{class:"rule"},[h("b",{text:r.title}),r.text])));

/* layout: people on the left, coordinator in the centre, agents on a ring, stores below */
const NS="http://www.w3.org/2000/svg",N=D.nodes,ids=Object.keys(N);
const by=k=>ids.filter(i=>N[i].kind===k);
const people=by("person"),agents=by("agent"),stores=by("store"),coord=by("coord");
const W=1000,H=640,cx=610,cy=290,rx=300,ry=190;
people.forEach((id,i)=>{const n=N[id];n.x??=105;n.y??=(H-80)*(i+1)/(people.length+1)});
coord.forEach(id=>{N[id].x??=cx;N[id].y??=cy});
agents.forEach((id,i)=>{const n=N[id],a=(-150+300*(agents.length>1?i/(agents.length-1):.5))*Math.PI/180;n.x??=cx+rx*Math.cos(a);n.y??=cy+ry*Math.sin(a);n.c??=PALETTE[i%PALETTE.length]});
stores.forEach((id,i)=>{const n=N[id];n.x??=cx+(i-(stores.length-1)/2)*260;n.y??=H-50});
ids.forEach(id=>{const n=N[id];if(n.kind==="person"||n.kind==="store"){n.w??=Math.max(150,n.label.length*11+36);n.h??=58}else n.r??=(n.kind==="coord"?62:44)});
const net=$("net");net.setAttribute("viewBox",`0 0 ${W} ${H}`);
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const rad=n=>n.r||Math.min(n.w,n.h)/2+14;
const pairs=new Set();D.scenarios.forEach(s=>s.steps.forEach(st=>st.edges.forEach(([a,b])=>pairs.add(a+">"+b))));
const edgeEl={};
pairs.forEach(k=>{const [a,b]=k.split(">"),A=N[a],B=N[b];const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
  const x1=A.x+ux*rad(A),y1=A.y+uy*rad(A),x2=B.x-ux*(rad(B)+6),y2=B.y-uy*(rad(B)+6),mx=(x1+x2)/2-uy*18,my=(y1+y2)/2+ux*18;
  edgeEl[k]=el("path",{class:"edge",d:`M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`},$("edges"))});
const nodeEl={};
ids.forEach(id=>{const n=N[id],g=el("g",{class:"nd"},$("nodes"));
  if(n.kind==="person")el("rect",{x:n.x-n.w/2,y:n.y-n.h/2,width:n.w,height:n.h,rx:29,fill:"var(--paper)"},g);
  else if(n.kind==="store")el("rect",{x:n.x-n.w/2,y:n.y-n.h/2,width:n.w,height:n.h,rx:10,fill:"var(--paper)","stroke-dasharray":"6 5"},g);
  else if(n.kind==="coord")el("circle",{cx:n.x,cy:n.y,r:n.r,fill:"#0E1A14"},g);
  else el("circle",{cx:n.x,cy:n.y,r:n.r,fill:n.c},g);
  const inside=n.kind!=="agent",t=el("text",{x:n.x,y:inside?n.y+5:n.y+n.r+20,"text-anchor":"middle"},g);t.textContent=n.label;
  if(n.kind==="coord")t.setAttribute("style","fill:#fff");nodeEl[id]=g});
let cur=0,timer=null;
function render(upto){
  Object.values(edgeEl).forEach(e=>e.setAttribute("class","edge"));const lit=new Set();
  D.scenarios[cur].steps.forEach((st,i)=>{if(i<upto)st.edges.forEach(([a,b])=>{edgeEl[a+">"+b].setAttribute("class","edge "+(i===upto-1?"now":"on"));lit.add(a);lit.add(b)})});
  for(const k in nodeEl)nodeEl[k].setAttribute("class","nd "+(lit.has(k)?"lit":(upto===0?"":"dim")));
  [...$("steps").children].forEach((li,i)=>li.className=i<upto-1?"done":(i===upto-1?"now":""))}
function pick(i){cur=i;clearInterval(timer);timer=null;const s=D.scenarios[i];
  [...$("scen").children].forEach((b,j)=>b.setAttribute("aria-pressed",j===i));
  $("sTitle").textContent=s.title;$("sSub").textContent=s.sub||"";
  $("steps").replaceChildren(...s.steps.map(st=>h("li",{text:st.text})));render(s.steps.length)}
function play(){clearInterval(timer);let shown=0;render(0);const n=D.scenarios[cur].steps.length;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){render(n);return}
  timer=setInterval(()=>{shown++;render(shown);if(shown>=n){clearInterval(timer);timer=null}},1300)}
D.scenarios.forEach((s,i)=>{const b=h("button",{class:"btn",text:s.title});b.addEventListener("click",()=>{pick(i);play()});$("scen").appendChild(b)});
$("play").addEventListener("click",play);$("all").addEventListener("click",()=>{clearInterval(timer);render(D.scenarios[cur].steps.length)});
if(D.scenarios.length){pick(0);play()}

/* agent cards */
$("h-deck").textContent=U.deckTitle;$("deckNote").textContent=U.deckNote;
D.agents.forEach((a,i)=>{
  const c=a.color||(N[a.node]&&N[a.node].c)||PALETTE[i%PALETTE.length];
  const front=h("div",{class:"face"},[
    h("div",{class:"top"},[h("span",{class:"no",text:String(i+1).padStart(2,"0")}),h("h3",{text:a.name}),h("div",{class:"role",text:a.role})]),
    h("div",{class:"body"},[
      h("div",{},[h("b",{text:U.cardWith}),h("div",{class:"links"},(a.with||[]).map(x=>h("span",{text:x})))]),
      h("div",{},[h("b",{text:U.cardOwner}),a.owner]),h("div",{},[h("b",{text:U.cardWhen}),a.when]),h("div",{},[h("b",{text:U.cardGoal}),a.goal]),
      h("div",{class:"turn",text:U.flipHint})])]);
  const back=h("div",{class:"face back"},[h("h3",{text:U.cardNot}),h("ul",{},(a.not||[]).map(x=>h("li",{text:x}))),h("h3",{text:U.cardRuleTitle}),h("p",{text:U.cardRule,style:"font-size:.92rem"})]);
  const btn=h("button",{class:"flip","aria-pressed":"false","aria-label":a.name+": "+U.flipLabel},[h("div",{class:"inner"},[front,back])]);
  const card=h("div",{class:"card",style:"--c:"+c},[btn]);
  btn.addEventListener("click",()=>{const on=card.classList.toggle("on");btn.setAttribute("aria-pressed",on)});$("deck").appendChild(card)});

/* function */
const F=D.function;$("h-club").textContent=U.functionTitle;$("fHead").textContent=F.headline;$("fContext").textContent=F.context||"";
F.teams.forEach((t,i)=>$("squads").appendChild(h("div",{class:"squad",style:"--c:"+PALETTE[(i+2)%PALETTE.length]},[h("b",{text:String(t.n)}),h("span",{text:t.name})])));
$("fPressTitle").textContent=U.pressureTitle;$("fPress").textContent=F.pressure||"";

/* processes by zone */
$("h-map").textContent=U.mapTitle.replace("{n}",D.processes.length);
[["A","background:var(--green)"],["B","background:#fff;background-image:repeating-linear-gradient(135deg,rgba(33,160,56,.4) 0 3px,transparent 3px 6px)"],["C","background:var(--ink)"],["w1","background:var(--sun)"]]
  .forEach(([k,s])=>$("legend").appendChild(h("span",{},[h("i",{class:"sw",style:s}),U.legend[k]])));
const why=$("why");function hint(){why.replaceChildren(h("strong",{text:U.whyHint}),h("br"),h("span",{class:"muted",text:U.priorityNote}))}hint();
D.processes.forEach(p=>{const b=h("button",{class:`sq ${p.zone}${p.wave1?" w1":""}`,"aria-pressed":"false"},[h("span",{text:p.name}),h("span",{class:"p",text:String(p.priority)})]);
  b.addEventListener("click",()=>{$("waffle").querySelectorAll(".sq").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");
    why.replaceChildren(h("strong",{text:p.name}),h("br"),h("span",{class:"muted",text:U.zone[p.zone]+(p.wave1?", "+U.wave1:"")+", "+U.priority+" "+p.priority}),h("p",{text:p.why,style:"margin:.5em 0 0"}))});
  $("waffle").appendChild(b)});

/* readiness */
$("h-ready").textContent=U.readyTitle;
D.readiness.forEach(r=>$("ready").appendChild(h("div",{class:"panel"},[h("span",{class:"tag "+r.status,text:U.status[r.status]}),h("h3",{text:r.title}),h("p",{text:r.text})])));
$("footer").textContent=D.footer||"";
</script>
